<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6b63ff" />

    <!-- Title & Basic Meta -->
    <title>Luckielarge | Startup Funding, Mentorship & Growth for African Founders</title>
    <meta
      name="description"
      content="Luckie Large helps African founders access funding, mentorship, and market opportunities to build sustainable businesses."
    />
    <meta
      name="keywords"
      content="Luckie Large, Luckielarge, African founders, startup funding, entrepreneurship, business growth, mentorship"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://luckielarge.com/" />

    <!-- Favicon & Manifest -->
    <link rel="icon" href="favicon_io\favicon-32x32.png" type="image/png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph (Facebook / LinkedIn / WhatsApp) -->
    <meta property="og:title" content="Luckielarge | Businessman and investor" />
    <meta
      property="og:description"
      content="Luckielarge supports founders across Africa with capital, mentorship, and access to new market opportunities."
    />
    <meta property="og:type" content="website" />
    <!-- MUST BE AN ABSOLUTE URL FOR SOCIAL PLATFORMS -->
    <meta property="og:image" content="https://luckielarge.com/images/image1.jpg" />
    <meta property="og:url" content="https://luckielarge.com/" />

    <!-- Twitter Card Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luckielarge | Supporting African Founders" />
    <meta name="twitter:description" content="Luckielarge supports founders across Africa with capital, mentorship, and access to market opportunities." />
    <meta name="twitter:image" content="https://luckielarge.com/images/image1.jpg" />

    <!-- Structured Data: Person / Entity Schema for Google Knowledge Panel -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Luckie Large",
      "jobTitle": "Founder / Managing Director",
      "birthDate": "1978-08-13",
      "url": "https://luckielarge.com",
      "sameAs": [
        "https://www.linkedin.com/in/luckielarge",
        "https://twitter.com/luckielarge"
      ]
    }
    </script>
  </head>
